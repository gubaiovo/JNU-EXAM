server {
    listen 80;
    server_name localhost;

    root /app/repo;
    index index.html;

    add_header Access-Control-Allow-Origin *;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.git {
        deny all;
    }
    
    location /src {
        deny all;
    }
}